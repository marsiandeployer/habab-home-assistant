map $http_upgrade $habab_voice_connection {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=habab_beta_enroll:1m rate=20r/m;
server {
    listen 80;
    server_name habab-voice.wpmix.net;
    access_log off;
    client_max_body_size 2m;
    location = /v1/audio/transcriptions {
        client_max_body_size 6m;
        client_body_timeout 20s;
        proxy_pass http://127.0.0.1:8326;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
    # Preserve the existing Exa MCP routes on their separately owned process.
    location = /mcp/exa {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8327;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 70s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
    location = /mcp/exa/capabilities {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8327;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 70s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
    location = /beta/enroll {
        client_max_body_size 1k;
        client_body_timeout 10s;
        limit_req zone=habab_beta_enroll burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18328;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Route the managed OpenAI-compatible text API to its owned process.
    location = /text/capabilities {
        proxy_pass http://127.0.0.1:18328;
        proxy_set_header Host $host;
        proxy_read_timeout 35s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Beta clients authenticate here; the text relay exchanges their hb1 or
    # existing owner credential for its private service credential upstream.
    location = /v1/capabilities {
        proxy_pass http://127.0.0.1:18328;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /v1/realtime/bootstrap {
        client_max_body_size 512k;
        client_body_timeout 10s;
        proxy_pass http://127.0.0.1:18328;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /v1/models {
        proxy_pass http://127.0.0.1:18328;
        proxy_set_header Host $host;
        proxy_read_timeout 35s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /v1/chat/completions {
        proxy_pass http://127.0.0.1:18328;
        proxy_set_header Host $host;
        proxy_read_timeout 190s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        proxy_pass http://127.0.0.1:8326;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $habab_voice_connection;
        proxy_read_timeout 190s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
