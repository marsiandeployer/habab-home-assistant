# habab-product-tunnel-managed-v2; generated for issue8pilot
Match User habab-home-issue8pilot
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/habab-product-tunnel/keys/issue8pilot
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitListen 127.0.0.1:32808
    PermitOpen none
    PermitTunnel no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitUserRC no
    MaxSessions 0
    ForceCommand /usr/bin/false
Match all
