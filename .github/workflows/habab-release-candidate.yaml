name: Habab release candidate

on:
  workflow_dispatch:
    inputs:
      target_scope:
        description: Build all ready targets, one platform, Android, or an unsigned Android runtime review candidate
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
          - android
          - android-runtime
      source_ref:
        description: Full commit SHA or existing tag (branches are rejected)
        required: true
        type: string
      android_version_code:
        description: New Android release versionCode, greater than distributed and installed builds
        required: false
        type: string
      android_version_name:
        description: Reviewed Android release versionName (no default version is selected)
        required: false
        type: string
      android_runtime_manifest_url:
        description: Optional signed runtime; must match the freshly compiled wheel and selected source
        required: false
        type: string
      android_base_runtime_manifest_url:
        description: Signed compatible base runtime URL, required only for android-runtime scope
        required: false
        type: string

  workflow_call:
    inputs:
      target_scope:
        type: string
        default: all
      source_ref:
        type: string
        required: true
      android_version_code:
        type: string
        default: ''
      android_version_name:
        type: string
        default: ''
      android_runtime_manifest_url:
        type: string
        default: ''
      android_base_runtime_manifest_url:
        type: string
        default: ''
      frontend_run_id:
        type: string
        default: ''
      release_tag:
        type: string
        required: true
    outputs:
      source_revision:
        value: ${{ jobs.resolve-source.outputs.source_revision }}
    secrets:
      HABAB_ANDROID_RUNTIME_SIGNING_KEY_BASE64:
        required: true
      HABAB_ANDROID_KEYSTORE_BASE64:
        required: true
      HABAB_ANDROID_KEYSTORE_PASSWORD:
        required: true
      HABAB_ANDROID_KEY_ALIAS:
        required: true
      HABAB_ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      source_revision: ${{ steps.resolve.outputs.source_revision }}
    steps:
      - name: Validate release caller contract
        if: ${{ inputs.release_tag != '' }}
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SCOPE: ${{ inputs.target_scope }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SCOPE" == all && "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^habab-v[0-9][0-9A-Za-z.+_-]{0,62}-[0-9a-f]{12}$ ]]
          [[ "$RELEASE_TAG" == *"-${SOURCE_REF:0:12}" ]]
      - id: resolve
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config extensions.partialClone origin
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          if [[ "$SOURCE_REF" =~ ^[0-9a-f]{40,64}$ ]]; then
            git fetch --filter=blob:none --no-tags origin "$SOURCE_REF"
            resolved=$(git rev-parse --verify "$SOURCE_REF^{commit}")
            [[ "$resolved" == "$SOURCE_REF" ]] || { echo '::error::Commit SHA did not resolve exactly'; exit 1; }
          else
            [[ "$SOURCE_REF" != refs/* && "$SOURCE_REF" != -* ]] && git check-ref-format "refs/tags/$SOURCE_REF" || { echo '::error::Pass a valid tag name or full SHA, not a branch/ref path'; exit 1; }
            git fetch --filter=blob:none --no-tags origin "refs/tags/$SOURCE_REF:refs/tags/$SOURCE_REF"
            resolved=$(git rev-parse --verify "refs/tags/$SOURCE_REF^{commit}") || { echo '::error::The requested tag does not exist'; exit 1; }
          fi
          git fetch --filter=blob:none --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$resolved" refs/remotes/origin/main; then
            echo '::error::Selected source is not an ancestor of current origin/main'; exit 1
          fi
          echo "source_revision=$resolved" >> "$GITHUB_OUTPUT"

  release-preflight:
    name: Run fast source checks
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REVISION: ${{ needs.resolve-source.outputs.source_revision }}
      HA_TEST_IMAGE: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
    steps:
      - name: Check out exact preflight source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.source_revision }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            habab/android/app/src/main/assets/release
            habab/android/tools
            habab/android/runtime/serialx_unix
            habab/distribution
            habab/scripts
            habab/product-tunnel
          sparse-checkout-cone-mode: true
      - name: Verify exact clean source
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REVISION" ]] || { echo '::error::Preflight checkout does not match the selected source'; exit 1; }
          git diff --quiet && git diff --cached --quiet || { echo '::error::Preflight checkout is dirty'; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || { echo '::error::Preflight checkout has untracked files'; exit 1; }
          [[ -f habab/distribution/tests/run_release_candidate_backend_tests.py ]] || {
            echo '::error::Selected source does not contain the release preflight runner; choose a revision with release fast checks'; exit 1;
          }
          [[ -f habab/distribution/tests/run_core_api_e2e.py ]] || {
            echo '::error::Selected source lacks the real Core API acceptance runner'; exit 1;
          }
          grep -Fq 'class ReleasePreflightWorkflowTests' habab/scripts/test_release_candidate.py || {
            echo '::error::Selected source does not contain the release preflight workflow tests; choose a revision with release fast checks'; exit 1;
          }
          trust_anchor=habab/android/app/src/main/assets/release/trusted-key.der
          [[ -f "$trust_anchor" ]] || { echo '::error::Selected source lacks the approved public runtime trust anchor'; exit 1; }
          git ls-files --error-unmatch "$trust_anchor" >/dev/null || {
            echo '::error::Approved public runtime trust anchor is not tracked in selected source'; exit 1;
          }
          trust_sha256=$(sha256sum "$trust_anchor" | cut -d' ' -f1)
          [[ "$trust_sha256" == ee1c6fbd9f95d1a3396cc68c103195e6e4fdd17349476c6599e7efad5ace9069 ]] || {
            echo '::error::Public runtime trust anchor differs from the approved key; review key rotation explicitly'; exit 1;
          }
          openssl pkey -pubin -inform DER -in "$trust_anchor" -noout
      - name: Test release preflight workflow gates
        run: PYTHONPATH=habab/scripts python3 -m unittest -v test_release_candidate.ReleasePreflightWorkflowTests
      - name: Test Android runtime source payload
        run: PYTHONPATH=habab/android/tools python3 -m unittest -q test_package_runtime_sources test_package_runtime_serialx test_node_inputs test_official_native_inputs
      - name: Test optional private wake model pack validation
        run: PYTHONPATH=habab/android/tools python3 -m unittest -q test_prepare_wake_experiments
      - name: Set up Node 24.21.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          check-latest: false
      - name: Run focused native JavaScript tests
        run: >-
          node --test
          habab/distribution/tests/test-automation-setup.mjs
          habab/distribution/tests/test-chat-lifecycle.mjs
          habab/distribution/tests/test-integration-setup.mjs
          habab/distribution/tests/test-provider-selection.mjs
          habab/distribution/tests/test-beta-session.mjs
          habab/distribution/tests/test-chat-tools.mjs
          habab/distribution/tests/telegram-panel-qr.test.mjs
          habab/distribution/tests/telegram-qr.test.mjs
      - name: Test Core API harness contract
        run: PYTHONPATH=habab/distribution/tests python3 -m unittest -q test_core_api_e2e_contract
      - name: Run focused backend tests in isolated Home Assistant image
        run: |
          set -euo pipefail
          network_name="habab-core-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(cat /proc/sys/kernel/random/uuid)"
          container_name="$network_name-core"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            docker network rm "$network_name" >/dev/null
          }
          docker network create --driver bridge --internal "$network_name" >/dev/null
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          [[ "$(docker network inspect --format '{{.Internal}}' "$network_name")" == true ]] || {
            echo '::error::Core CI network must be internal'; exit 1;
          }
          docker run --rm --name "$container_name" --pull=missing \
            --network "$network_name" --memory=2g --memory-swap=2g --cpus=2 --pids-limit=256 \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env GITHUB_ACTIONS=true \
            --volume "$GITHUB_WORKSPACE/habab/distribution:/workspace/habab/distribution:ro" \
            --volume "$GITHUB_WORKSPACE/habab/product-tunnel:/workspace/habab/product-tunnel:ro" \
            --workdir /tmp --entrypoint /bin/sh "$HA_TEST_IMAGE" \
            -ec 'python3 /workspace/habab/distribution/tests/run_release_candidate_backend_tests.py && python3 /workspace/habab/distribution/tests/run_core_api_e2e.py'

  windows-source:
    needs: [resolve-source, release-preflight]
    if: ${{ inputs.target_scope == 'all' || inputs.target_scope == 'windows' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch only Windows package source blobs
        env:
          SOURCE_REVISION: ${{ needs.resolve-source.outputs.source_revision }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config extensions.partialClone origin
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --filter=blob:none --no-tags --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout init --cone
          git sparse-checkout set habab/distribution habab/product-tunnel
          git checkout --detach FETCH_HEAD
      - name: Test Windows packaging contract
        run: python -m unittest discover -s habab/distribution/tests -p test_windows_installer.py -v
      - name: Create exact-source Windows distribution snapshot
        env:
          SOURCE_REVISION: ${{ needs.resolve-source.outputs.source_revision }}
          HABAB_WINDOWS_PUBLIC_BASE: ${{ inputs.release_tag != '' && format('https://github.com/{0}/releases/download/{1}', github.repository, inputs.release_tag) || 'https://habab-demo.wpmix.net/downloads' }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REVISION" ]] || { echo '::error::Windows checkout does not match the selected source'; exit 1; }
          git diff --quiet && git diff --cached --quiet || { echo '::error::Windows checkout is dirty'; exit 1; }
          runner_temp=$(cygpath -u "$RUNNER_TEMP")
          snapshot=$(mktemp -d "$runner_temp/habab-source.XXXXXX")
          trap 'rm -rf "$snapshot"' EXIT
          git archive "$SOURCE_REVISION" habab/distribution habab/product-tunnel | tar -x -C "$snapshot"
          export HABAB_SOURCE_REVISION="$SOURCE_REVISION" HABAB_SOURCE_DIRTY=false
          python "$snapshot/habab/distribution/package-windows.py"
          pwsh -NoProfile -File "$snapshot/habab/distribution/installer/build-windows-installer.ps1"
          mkdir -p candidate/windows
          python - "$snapshot/habab/public/downloads" candidate/windows "$SOURCE_REVISION" <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          import sys
          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          revision = sys.argv[3]
          metadata = json.loads((source / 'windows-package.json').read_text())
          for name in (metadata['filename'], 'windows-package.json', 'start-home-assistant.bat',
                       'start-xiaomi-home.bat', 'support_tunnel.bat', 'habab_home_assistant.exe'):
              path = source / name
              if not path.is_file():
                  raise SystemExit(f'Canonical Windows builder output is missing: {name}')
              shutil.copy2(path, destination / name)
          (destination / 'status.json').write_text(json.dumps({
              'state': 'built', 'source_revision': revision,
              'source_dirty': False, 'kind': 'installer-package',
              'filename': metadata['filename'],
              'workflow_revision': os.environ['GITHUB_WORKFLOW_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}, sort_keys=True) + '\n')
          PY
          windows_zip=$(python -c 'import json; print(json.load(open("candidate/windows/windows-package.json"))["filename"])')
          python -m zipfile -t "candidate/windows/$windows_zip"
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: candidate-windows
          path: candidate
          if-no-files-found: error
          retention-days: 1

  linux-image:
    needs: [resolve-source, release-preflight]
    if: ${{ inputs.target_scope == 'all' || inputs.target_scope == 'linux' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: linux-amd64
          - platform: linux/arm64
            artifact: linux-arm64
    steps:
      - name: Fetch only Linux image source blobs
        env:
          SOURCE_REVISION: ${{ needs.resolve-source.outputs.source_revision }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config extensions.partialClone origin
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --filter=blob:none --no-tags --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout init --cone
          git sparse-checkout set habab/distribution habab/scripts habab/product-tunnel
          git checkout --detach FETCH_HEAD
      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1
      - name: Build Linux OCI candidate
        env:
          SOURCE_REVISION: ${{ needs.resolve-source.outputs.source_revision }}
          PLATFORM: ${{ matrix.platform }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REVISION" ]] || { echo '::error::Linux checkout does not match the selected source'; exit 1; }
          git diff --quiet && git diff --cached --quiet || { echo '::error::Linux checkout is dirty'; exit 1; }
          mkdir -p "candidate/$ARTIFACT" habab/distribution/product-tunnel
          cp habab/product-tunnel/web_tunnel.py habab/distribution/product-tunnel/web_tunnel.py
          docker buildx build --platform "$PLATFORM" --pull=false \
            --build-arg "HABAB_SOURCE_REVISION=$SOURCE_REVISION" \
            --build-arg HABAB_SOURCE_DIRTY=false \
            --output "type=oci,dest=candidate/$ARTIFACT/habab-home-${ARTIFACT}.oci.tar" \
            habab/distribution
          python3 habab/scripts/release-candidate.py \
            --verify-linux-image "candidate/$ARTIFACT/habab-home-${ARTIFACT}.oci.tar" \
            --platform "$PLATFORM" \
            --source-revision "$SOURCE_REVISION" \
            --status-output "candidate/$ARTIFACT/status.json"
          gzip --no-name --fast "candidate/$ARTIFACT/habab-home-${ARTIFACT}.oci.tar"
          python3 - "$ARTIFACT/status.json" <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          import sys
          status_path = Path('candidate') / sys.argv[1]
          status = json.loads(status_path.read_text())
          status.update({
              'workflow_revision': os.environ['GITHUB_WORKFLOW_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          })
          status_path.write_text(json.dumps(status, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: candidate-${{ matrix.artifact }}
          path: candidate
          if-no-files-found: error
          retention-days: 1

  android-inputs:
    needs: [resolve-source, release-preflight]
    if: ${{ inputs.target_scope == 'all' || inputs.target_scope == 'android' || inputs.target_scope == 'android-runtime' }}
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.inputs.outputs.state || steps.unsigned.outputs.state }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      FRONTEND_RUN_ID: ${{ inputs.frontend_run_id || github.run_id }}
      RUNTIME_MANIFEST_URL: ${{ inputs.android_runtime_manifest_url }}
      ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.android_version_name }}
      ANDROID_BASE_RUNTIME_MANIFEST_URL: ${{ inputs.android_base_runtime_manifest_url }}
      SOURCE_REVISION: ${{ needs.resolve-source.outputs.source_revision }}
    steps:
      - id: inputs
        name: Gate Android runtime and signing inputs
        if: ${{ inputs.target_scope != 'android-runtime' }}
        env:
          RUNTIME_SIGNING_KEY_BASE64: ${{ secrets.HABAB_ANDROID_RUNTIME_SIGNING_KEY_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.HABAB_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HABAB_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.HABAB_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.HABAB_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ANDROID_VERSION_CODE" ]] || missing+=("new Android versionCode")
          [[ -n "$ANDROID_VERSION_NAME" ]] || missing+=("reviewed Android versionName")
          [[ -n "$RUNTIME_MANIFEST_URL" || -n "$RUNTIME_SIGNING_KEY_BASE64" ]] || missing+=("runtime signing key or signed same-source runtime manifest URL")
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=("release keystore")
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=("keystore password")
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=("key alias")
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=("key password")
          if (( ${#missing[@]} > 0 )); then
            if [[ "${{ inputs.target_scope }}" == android || -n "${RELEASE_TAG:-}" ]]; then
              echo '::error::Android scope requires explicit Android version code/name, runtime signing key (or matching signed runtime) and all APK release signing inputs'
              exit 1
            fi
            echo 'Android candidate is blocked because required version/runtime/signing inputs are missing.'
            mkdir -p candidate/android
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          status = {
              'state': 'blocked',
              'source_revision': os.environ['SOURCE_REVISION'],
              'source_dirty': False,
              'reason': 'explicit Android version code/name, runtime signing key (or matching signed runtime) and all APK release signing inputs are required',
              'workflow_revision': os.environ['GITHUB_WORKFLOW_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }
          Path('candidate/android/status.json').write_text(json.dumps(status, indent=2, sort_keys=True) + '\n')
          PY
            echo 'state=blocked' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$ANDROID_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] && (( ANDROID_VERSION_CODE <= 2100000000 )) || {
            echo '::error::Android versionCode must be an integer between 1 and 2100000000'
            exit 1
          }
          [[ "$ANDROID_VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$ ]] || {
            echo '::error::Android versionName must contain 1-64 release label characters'
            exit 1
          }
          echo 'state=built' >> "$GITHUB_OUTPUT"
          if [[ -n "$RUNTIME_MANIFEST_URL" ]]; then
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          url = urlsplit(os.environ['RUNTIME_MANIFEST_URL'])
          if (url.scheme != 'https' or url.hostname != 'habab-demo.wpmix.net'
                  or url.username or url.password or url.query or url.fragment
                  or not url.path.startswith('/downloads/android/')):
              raise SystemExit('::error::Android runtime manifest must use the canonical HTTPS downloads path')
          PY
          fi

      - id: unsigned
        name: Gate unsigned runtime candidate inputs
        if: ${{ inputs.target_scope == 'android-runtime' }}
        env:
          ANDROID_BASE_RUNTIME_MANIFEST_URL: ${{ inputs.android_base_runtime_manifest_url }}
          ANDROID_RUNTIME_MANIFEST_URL: ${{ inputs.android_runtime_manifest_url }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.android_version_name }}
        run: |
          set -euo pipefail
          [[ -z "$ANDROID_RUNTIME_MANIFEST_URL" && -z "$ANDROID_VERSION_CODE" && -z "$ANDROID_VERSION_NAME" ]] || {
            echo '::error::android-runtime accepts only the base runtime URL; normal Android runtime/version inputs must be blank'
            exit 1
          }
          [[ -n "$ANDROID_BASE_RUNTIME_MANIFEST_URL" ]] || {
            echo '::error::android-runtime requires a signed compatible base runtime manifest URL'
            exit 1
          }
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          url = urlsplit(os.environ['ANDROID_BASE_RUNTIME_MANIFEST_URL'])
          if (url.scheme != 'https' or url.hostname != 'habab-demo.wpmix.net'
                  or url.username or url.password or url.query or url.fragment
                  or not url.path.startswith('/downloads/android/')):
              raise SystemExit('::error::Base runtime must use the canonical HTTPS Android downloads path')
          PY
          echo 'state=unsigned_candidate' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Fetch pinned Android runtime input checker
        if: ${{ steps.inputs.outputs.state == 'built' }}
        with:
          ref: ${{ needs.resolve-source.outputs.source_revision }}
          persist-credentials: false
          sparse-checkout: habab/android/tools
      - name: Check locked runtime download availability before compiling frontend
        if: ${{ steps.inputs.outputs.state == 'built' }}
        run: python3 habab/android/tools/check_node_inputs.py

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ steps.inputs.outputs.state == 'blocked' }}
        with:
          name: candidate-android
          path: candidate
          if-no-files-found: error
          retention-days: 1

  android-frontend:
    needs: [resolve-source, android-inputs]
    if: ${{ inputs.frontend_run_id == '' && (needs.android-inputs.outputs.state == 'built' || needs.android-inputs.outputs.state == 'unsigned_candidate') }}
    uses: ./.github/workflows/habab-native-frontend-candidate.yaml
    with:
      source_ref: ${{ needs.resolve-source.outputs.source_revision }}
      wheel_version: 20260930.4+habab.20

  android:
    needs: [resolve-source, android-inputs, android-frontend]
    if: ${{ always() && needs.resolve-source.result == 'success' && needs.android-inputs.result == 'success' && (needs.android-inputs.outputs.state == 'blocked' || needs.android-frontend.result == 'success' || (inputs.frontend_run_id != '' && needs.android-frontend.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      state: ${{ needs.android-inputs.outputs.state }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      FRONTEND_RUN_ID: ${{ inputs.frontend_run_id || github.run_id }}
      RUNTIME_MANIFEST_URL: ${{ inputs.android_runtime_manifest_url }}
      ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.android_version_name }}
      ANDROID_BASE_RUNTIME_MANIFEST_URL: ${{ inputs.android_base_runtime_manifest_url }}
      SOURCE_REVISION: ${{ needs.resolve-source.outputs.source_revision }}
      ANDROID_PUBLIC_BASE: ${{ inputs.release_tag != '' && format('https://github.com/{0}/releases/download/{1}', github.repository, inputs.release_tag) || 'https://habab-demo.wpmix.net/downloads/android' }}
    steps:
      - name: Select the supported Java 17 toolchain and verify Android SDK tools
        if: ${{ needs.android-inputs.outputs.state == 'built' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:-}" && test -x "$JAVA_HOME_17_X64/bin/java" || {
            echo '::error::The Android build requires the runner Java 17 toolchain'; exit 1;
          }
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk_root" || { echo '::error::The runner Android SDK root is missing'; exit 1; }
          android_sdkmanager="$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$android_sdkmanager" || {
            echo '::error::The runner SDK manager is missing at cmdline-tools/latest/bin/sdkmanager'; exit 1;
          }
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$android_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDKMANAGER=$android_sdkmanager" >> "$GITHUB_ENV"
          "$JAVA_HOME/bin/java" -version
          "$android_sdkmanager" --version
      - name: Ensure pinned Android SDK packages before runtime packaging
        if: ${{ needs.android-inputs.outputs.state == 'built' }}
        run: |
          set -euo pipefail
          "$ANDROID_SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          for tool in aapt apksigner zipalign; do
            test -x "$ANDROID_HOME/build-tools/34.0.0/$tool"
          done
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          android_ndk_root="$ANDROID_HOME/ndk/27.2.12479018"
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*27\.2\.12479018[[:space:]]*$' "$android_ndk_root/source.properties"
          echo "ANDROID_NDK=$android_ndk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$android_ndk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$android_ndk_root" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
      - name: Fetch only Android and distribution source blobs
        env:
          SOURCE_REVISION: ${{ needs.resolve-source.outputs.source_revision }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config extensions.partialClone origin
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --filter=blob:none --no-tags --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout init --cone
          git sparse-checkout set habab/android habab/distribution habab/native-frontend
          git checkout --detach FETCH_HEAD
      - name: Verify clean Android checkout before generating inputs
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REVISION" ]] || { echo '::error::Android checkout does not match the selected source'; exit 1; }
          git diff --quiet && git diff --cached --quiet || { echo '::error::Android checkout is dirty'; exit 1; }
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        if: ${{ needs.android-inputs.outputs.state == 'built' || needs.android-inputs.outputs.state == 'unsigned_candidate' }}
        with:
          name: ${{ needs.android-frontend.outputs.artifact_name || 'habab-native-frontend-20260930.4+habab.20' }}
          path: frontend-input
          run-id: ${{ inputs.frontend_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the original frontend manifest and wheel against the frozen product source
        if: ${{ needs.android-inputs.outputs.state == 'built' || needs.android-inputs.outputs.state == 'unsigned_candidate' }}
        run: |
          python3 - "$SOURCE_REVISION" <<'PY'
          import sys
          sys.path.insert(0, 'habab/native-frontend')
          from candidate import load_candidate
          load_candidate('frontend-input', sys.argv[1])
          PY
      - name: Fetch and validate signed base runtime for unsigned candidate reuse
        if: ${{ needs.android-inputs.outputs.state == 'unsigned_candidate' }}
        env:
          BASE_MANIFEST_URL: ${{ inputs.android_base_runtime_manifest_url }}
        run: |
          set -euo pipefail
          mkdir -p runtime-base
          curl --fail --location --silent --show-error "$BASE_MANIFEST_URL" -o runtime-base/release.json
          curl --fail --location --silent --show-error "$BASE_MANIFEST_URL.sig" -o runtime-base/release.json.sig
          openssl pkey -pubin -inform DER -in habab/android/app/src/main/assets/release/trusted-key.der \
            -out runtime-base/runtime-public.pem
          base64 --decode runtime-base/release.json.sig > runtime-base/signature
          openssl dgst -sha256 -verify runtime-base/runtime-public.pem \
            -signature runtime-base/signature runtime-base/release.json
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          from urllib.parse import urlsplit
          release = json.loads(Path('runtime-base/release.json').read_text())
          url = urlsplit(release.get('url', ''))
          if (url.scheme != 'https' or url.hostname != 'habab-demo.wpmix.net'
                  or url.username or url.password or url.query or url.fragment
                  or not url.path.startswith('/downloads/android/')):
              raise SystemExit('Base runtime archive URL is not canonical')
          name = Path(url.path).name
          if not name or name in {'.', '..'}:
              raise SystemExit('Base runtime archive URL has no safe filename')
          base_manifest = urlsplit(os.environ['BASE_MANIFEST_URL'])
          expected_manifest_path = url.path.rsplit('/', 1)[0] + '/release-' + release['id'] + '.json'
          if (base_manifest.scheme != 'https' or base_manifest.hostname != url.hostname
                  or base_manifest.path != expected_manifest_path):
              raise SystemExit('Base manifest URL does not identify the signed runtime archive')
          if (not isinstance(release.get('bytes'), int) or release['bytes'] <= 0
                  or not isinstance(release.get('unpackedBytes'), int) or release['unpackedBytes'] <= 0):
              raise SystemExit('Base runtime manifest has invalid disk size fields')
          required_after_download = release['unpackedBytes'] + release['bytes'] + 1024 ** 3
          required_before_download = required_after_download + release['bytes']
          free = shutil.disk_usage('.').free
          if free < required_before_download:
              raise SystemExit(
                  f'Insufficient disk space before base download: need {required_before_download} bytes, have {free}')
          Path('runtime-base/archive-name.txt').write_text(name)
          PY
          archive_name=$(cat runtime-base/archive-name.txt)
          df -h /
          curl --fail --location --silent --show-error \
            "$(python3 -c 'import json; print(json.load(open("runtime-base/release.json"))["url"])')" \
            -o "runtime-base/$archive_name"
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          release = json.loads(Path('runtime-base/release.json').read_text())
          archive = Path('runtime-base') / Path(release['url']).name
          if archive.stat().st_size != release.get('bytes'):
              raise SystemExit('Base runtime archive size differs from its signed manifest')
          required = release['unpackedBytes'] + release['bytes'] + 1024 ** 3
          free = shutil.disk_usage('.').free
          if free < required:
              raise SystemExit(f'Insufficient disk space after base download: need {required} bytes, have {free}')
          PY
      - name: Build unsigned same-source runtime candidate
        if: ${{ needs.android-inputs.outputs.state == 'unsigned_candidate' }}
        run: |
          set -euo pipefail
          df -h /
          network_tools=()
          if python3 -c 'import json; from pathlib import Path; raise SystemExit(0 if json.loads(Path("runtime-base/release.json").read_text()).get("networkTools") else 1)'; then
            network_tools=(--network-tools)
          fi
          python3 habab/android/tools/package_runtime.py \
            --unsigned-candidate --source-revision "$SOURCE_REVISION" \
            --frontend-candidate frontend-input \
            --base-runtime-manifest runtime-base/release.json \
            --public-base https://habab-demo.wpmix.net/downloads/android \
            "${network_tools[@]}"
          manifest=$(find habab/android/dist -maxdepth 1 -name 'release-*.json' -type f -print -quit)
          test -n "$manifest"
          python3 habab/android/tools/verify_runtime.py "$manifest" \
            --unsigned-candidate --source-revision "$SOURCE_REVISION" \
            --frontend-candidate frontend-input
          mkdir -p candidate/android-runtime
          archive=$(python3 -c 'import json,sys; from pathlib import Path; print(Path(json.load(open(sys.argv[1]))["url"]).name)' "$manifest")
          cp "$manifest" candidate/android-runtime/
          cp "habab/android/dist/$archive" candidate/android-runtime/
          cp frontend-input/manifest.json candidate/android-runtime/manifest.json
          cp frontend-input/*.whl candidate/android-runtime/
          python3 - "$manifest" "$archive" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          release = json.loads(Path(sys.argv[1]).read_text())
          status = {
              'state': 'unsigned_candidate',
              'candidate_type': 'unsigned-runtime-review-only',
              'signature': 'unsigned-candidate',
              'publishable': False,
              'apk_built': False,
              'source_revision': os.environ['SOURCE_REVISION'],
              'source_dirty': False,
              'runtime_id': release['id'],
              'manifest': Path(sys.argv[1]).name,
              'archive': sys.argv[2],
              'sha256': release['sha256'],
              'bytes': release['bytes'],
              'native_frontend': release['nativeFrontend'],
              'workflow_revision': os.environ['GITHUB_WORKFLOW_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }
          Path('candidate/android-runtime/status.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n')
          PY
      - name: Build fresh same-source runtime with the compiled frontend
        if: ${{ needs.android-inputs.outputs.state == 'built' && inputs.android_runtime_manifest_url == '' }}
        env:
          RUNTIME_SIGNING_KEY_BASE64: ${{ secrets.HABAB_ANDROID_RUNTIME_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/habab-runtime-signing.pem"
          trap 'rm -f "$key" "$RUNNER_TEMP/habab-runtime-public.der"' EXIT
          printf '%s' "$RUNTIME_SIGNING_KEY_BASE64" | base64 --decode > "$key"
          openssl pkey -in "$key" -pubout -outform DER -out "$RUNNER_TEMP/habab-runtime-public.der"
          cmp "$RUNNER_TEMP/habab-runtime-public.der" habab/android/app/src/main/assets/release/trusted-key.der
          df -h /
          python3 habab/android/tools/package_runtime.py \
            --signing-key "$key" --source-revision "$SOURCE_REVISION" \
            --frontend-candidate frontend-input \
            --public-base "$ANDROID_PUBLIC_BASE"
          mkdir -p runtime-input
          cp habab/android/dist/release-*.json runtime-input/release.json
          cp habab/android/dist/release-*.json.sig runtime-input/release.json.sig
      - name: Verify same-source signed runtime input
        if: ${{ needs.android-inputs.outputs.state == 'built' }}
        env:
          RUNTIME_PUBLIC_KEY: habab/android/app/src/main/assets/release/trusted-key.der
        run: |
          set -euo pipefail
          mkdir -p candidate/android runtime-input
          if [[ -n "$RUNTIME_MANIFEST_URL" ]]; then
            curl --fail --location --silent --show-error "$RUNTIME_MANIFEST_URL" -o runtime-input/release.json
            curl --fail --location --silent --show-error "$RUNTIME_MANIFEST_URL.sig" -o runtime-input/release.json.sig
          fi
          openssl pkey -pubin -inform DER -in habab/android/app/src/main/assets/release/trusted-key.der \
            -out runtime-input/runtime-public.pem
          base64 --decode runtime-input/release.json.sig > runtime-input/signature
          openssl dgst -sha256 -verify runtime-input/runtime-public.pem \
            -signature runtime-input/signature runtime-input/release.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          import runpy
          import tempfile
          producer = runpy.run_path('habab/android/tools/package_runtime.py')
          with tempfile.TemporaryDirectory(prefix='habab-source-readback-') as directory:
              expected = producer['copy_sources'](Path(directory))
          release = json.loads(Path('runtime-input/release.json').read_text())
          if release.get('sourceRevision') != os.environ['SOURCE_REVISION']:
              raise SystemExit('::error::Signed runtime manifest must attest this exact sourceRevision')
          if release.get('sourceFiles') != expected:
              raise SystemExit('::error::Runtime sourceFiles do not match this exact checkout')
          node_lock = json.loads(Path('habab/android/tools/network_tools/node-apks.lock.json').read_text())
          locked_packages = node_lock.get('packages')
          if not isinstance(locked_packages, dict) or not locked_packages:
              raise SystemExit('::error::Checkout Node APK lock has no package inventory')
          network_tools = release.get('networkTools')
          expected_node_packages = {}
          for name, record in locked_packages.items():
              digest = record.get('sha256') if isinstance(record, dict) else None
              if not isinstance(digest, str) or len(digest) != 64 or any(ch not in '0123456789abcdef' for ch in digest):
                  raise SystemExit('::error::Checkout Node APK lock has an invalid package digest')
              if network_tools and name.startswith('icu-data-en-'):
                  continue
              expected_node_packages[name] = digest
          if release.get('nodePackages') != expected_node_packages:
              raise SystemExit('::error::Runtime Node APK inventory does not match the selected source lock')
          launcher = Path('habab/android/runtime/launch.py')
          if release.get('androidLauncherSha256') != hashlib.sha256(launcher.read_bytes()).hexdigest():
              raise SystemExit('::error::Android runtime launcher does not match this exact checkout')
          # Use the producer's canonical seed; do not duplicate its YAML assembly.
          config = producer['initial_configuration']()
          if release.get('configurationSha256') != hashlib.sha256(config.encode()).hexdigest():
              raise SystemExit('::error::Android runtime seed configuration does not match this exact checkout')
          if network_tools := release.get('networkTools'):
              lock = Path('habab/android/tools/network_tools/network-tools.lock.json')
              if network_tools.get('lockSha256') != hashlib.sha256(lock.read_bytes()).hexdigest():
                  raise SystemExit('::error::Android network-tools lock does not match this exact checkout')
              for key, template in (
                  ('browserLauncherSha256', 'habab/android/tools/network_tools/habab-browser'),
                  ('pythonLauncherSha256', 'habab/android/tools/network_tools/habab-python-network'),
              ):
                  if network_tools.get(key) != hashlib.sha256(Path(template).read_bytes()).hexdigest():
                      raise SystemExit('::error::Android network-tools launcher does not match this exact checkout')
          url = release.get('url', '')
          archive_url = urlsplit(url)
          public_base = os.environ.get('ANDROID_PUBLIC_BASE', 'https://habab-demo.wpmix.net/downloads/android')
          if (not url.startswith(public_base + '/') or '/' in url[len(public_base) + 1:]
                  or archive_url.scheme != 'https' or archive_url.username or archive_url.password
                  or archive_url.query or archive_url.fragment):
              raise SystemExit('::error::Runtime archive must use the canonical HTTPS downloads path')
          archive_name = Path(archive_url.path).name
          if not archive_name or archive_name in {'.', '..'}:
              raise SystemExit('::error::Runtime archive URL has no safe filename')
          Path('runtime-input/archive-url.txt').write_text(url)
          PY
          archive_url=$(cat runtime-input/archive-url.txt)
          archive_name=${archive_url##*/}
          mkdir -p habab/android/dist
          if [[ -n "$RUNTIME_MANIFEST_URL" ]]; then
            curl --fail --location --silent --show-error "$archive_url" -o "runtime-input/$archive_name"
            cp "runtime-input/$archive_name" habab/android/dist/
          fi
          cp runtime-input/release.json habab/android/dist/
          cp runtime-input/release.json.sig habab/android/dist/release.json.sig
          python3 habab/android/tools/verify_runtime.py habab/android/dist/release.json \
            --public-key "$RUNTIME_PUBLIC_KEY" --source-revision "$SOURCE_REVISION" \
            --frontend-candidate frontend-input
          mkdir -p candidate/android
          cp "habab/android/dist/$archive_name" candidate/android/
          cp habab/android/dist/release*.json* candidate/android/
          cp frontend-input/manifest.json candidate/android/frontend-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          import runpy
          verifier = runpy.run_path('habab/android/tools/verify_runtime.py')
          manifest = Path('habab/android/dist/release.json')
          release = json.loads(manifest.read_text())
          provenance = verifier['apk_provenance'](release, manifest)
          # Always overwrite the checkout pointer, including the fresh blank-URL path.
          url = verifier['runtime_manifest_url'](release)
          Path('habab/android/app/src/main/assets/release/default-url.txt').write_text(url + '\n')
          filename = url.rsplit('/', 1)[1]
          Path('candidate/android').mkdir(parents=True, exist_ok=True)
          Path('candidate/android', filename).write_bytes(manifest.read_bytes())
          Path('candidate/android', filename + '.sig').write_bytes(Path(str(manifest) + '.sig').read_bytes())
          Path('habab/android/app/src/main/assets/release/build-provenance.json').write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          PY
      - name: Prepare pinned APK native tools and voice model
        if: ${{ needs.android-inputs.outputs.state == 'built' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends patchelf
          python3 habab/android/tools/prepare_native.py
          python3 habab/android/tools/prepare_voice.py
          if find habab/android/app/src/main/assets -type f \( -path '*/voice/experiments/*' -o -iname '*.wav' -o -iname '*.tflite' -o -iname '*.onnx' \) -print -quit | grep -q .; then
            echo '::error::Private experimental models or audio are forbidden in a public APK'; exit 1
          fi
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        if: ${{ needs.android-inputs.outputs.state == 'built' }}
        with:
          gradle-version: '8.5'
          cache-disabled: true
          dependency-graph: disabled
      - name: Run Android unit tests before APK packaging
        if: ${{ needs.android-inputs.outputs.state == 'built' }}
        run: |
          set -euo pipefail
          gradle --no-daemon -p habab/android \
            "-PappVersionCode=$ANDROID_VERSION_CODE" "-PappVersionName=$ANDROID_VERSION_NAME" \
            :app:testDebugUnitTest
      - name: Lint and assemble Android APK
        if: ${{ needs.android-inputs.outputs.state == 'built' }}
        run: |
          set -euo pipefail
          gradle --no-daemon -p habab/android \
            "-PappVersionCode=$ANDROID_VERSION_CODE" "-PappVersionName=$ANDROID_VERSION_NAME" \
            :app:lintDebug :app:assembleRelease
      - name: Sign APK with release keystore
        if: ${{ needs.android-inputs.outputs.state == 'built' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.HABAB_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HABAB_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.HABAB_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.HABAB_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/habab-release.jks"
          trap 'rm -f "$keystore"' EXIT
          [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]] || { echo '::error::HABAB_ANDROID_KEYSTORE_BASE64 is required to sign Android APK'; exit 1; }
          [[ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]] || { echo '::error::HABAB_ANDROID_KEYSTORE_PASSWORD is required to sign Android APK'; exit 1; }
          [[ -n "${ANDROID_KEY_ALIAS:-}" ]] || { echo '::error::HABAB_ANDROID_KEY_ALIAS is required to sign Android APK'; exit 1; }
          [[ -n "${ANDROID_KEY_PASSWORD:-}" ]] || { echo '::error::HABAB_ANDROID_KEY_PASSWORD is required to sign Android APK'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          unsigned=$(find habab/android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$unsigned"
          build_tools="$ANDROID_HOME/build-tools/34.0.0"
          "$build_tools/zipalign" -p -f 4 "$unsigned" candidate/android/habab-home-unsigned-aligned.apk
          "$build_tools/apksigner" sign --ks "$keystore" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD \
            --out candidate/android/habab-home-arm64.apk candidate/android/habab-home-unsigned-aligned.apk
          "$build_tools/apksigner" verify --verbose candidate/android/habab-home-arm64.apk
          rm candidate/android/habab-home-unsigned-aligned.apk
          printf '{"state":"built","source_revision":"%s","source_dirty":false,"runtime_manifest":"%s"}\n' "$SOURCE_REVISION" "$RUNTIME_MANIFEST_URL" > candidate/android/status.json
          export ANDROID_AAPT="$build_tools/aapt"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import runpy
          manifest = Path('habab/android/dist/release.json')
          release = json.loads(manifest.read_text())
          runpy.run_path('habab/android/tools/verify_runtime.py')['verify_apk_provenance'](
              Path('candidate/android/habab-home-arm64.apk'), release, manifest)
          status_path = Path('candidate/android/status.json')
          status = json.loads(status_path.read_text())
          release = json.loads(Path('habab/android/dist/release.json').read_text())
          status['apk_version'] = runpy.run_path('habab/android/tools/verify_runtime.py')['verify_apk_version'](
              Path('candidate/android/habab-home-arm64.apk'), os.environ['ANDROID_AAPT'],
              os.environ['ANDROID_VERSION_CODE'], os.environ['ANDROID_VERSION_NAME'])
          status['frontend_artifact_run_id'] = os.environ['FRONTEND_RUN_ID']
          status['apk_signature'] = 'verified-release'
          status['publishable'] = True
          status['native_frontend'] = release['nativeFrontend']
          status['runtime_manifest'] = Path('habab/android/app/src/main/assets/release/default-url.txt').read_text().strip()
          status.update({
              'workflow_revision': os.environ['GITHUB_WORKFLOW_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          })
          status_path.write_text(json.dumps(status, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ success() && needs.android-inputs.outputs.state == 'built' }}
        with:
          name: candidate-android
          path: candidate
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: ${{ success() && needs.android-inputs.outputs.state == 'unsigned_candidate' }}
        with:
          name: candidate-android-runtime-unsigned
          path: candidate/android-runtime
          if-no-files-found: error
          retention-days: 1

  assemble-candidate:
    needs: [resolve-source, release-preflight, windows-source, linux-image, android]
    if: >-
      ${{
        inputs.target_scope != 'android-runtime' &&
        always() && needs.resolve-source.result == 'success' &&
        needs.release-preflight.result == 'success' &&
        ((inputs.target_scope == 'all' || inputs.target_scope == 'windows') && needs.windows-source.result == 'success' ||
         (inputs.target_scope == 'linux' || inputs.target_scope == 'android') && needs.windows-source.result == 'skipped') &&
        ((inputs.target_scope == 'all' || inputs.target_scope == 'linux') && needs.linux-image.result == 'success' ||
         (inputs.target_scope == 'windows' || inputs.target_scope == 'android') && needs.linux-image.result == 'skipped') &&
        ((inputs.target_scope == 'all' || inputs.target_scope == 'android') && needs.android.result == 'success' ||
         (inputs.target_scope == 'windows' || inputs.target_scope == 'linux') && needs.android.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch only candidate manifest source blobs
        env:
          SOURCE_REVISION: ${{ needs.resolve-source.outputs.source_revision }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config extensions.partialClone origin
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --filter=blob:none --no-tags --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout init --cone
          git sparse-checkout set habab/distribution habab/product-tunnel habab/scripts
          git checkout --detach FETCH_HEAD
      - name: Verify aggregation checkout
        env:
          SOURCE_REVISION: ${{ needs.resolve-source.outputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REVISION" ]] || { echo '::error::Aggregation checkout does not match the candidate source'; exit 1; }
          git diff --quiet && git diff --cached --quiet || { echo '::error::Aggregation checkout is dirty'; exit 1; }
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: candidate-*
          path: candidate
          merge-multiple: true
      - name: Record checksums and explicit platform status
        env:
          SOURCE_REVISION: ${{ needs.resolve-source.outputs.source_revision }}
          ANDROID_RESULT: ${{ needs.android.outputs.state }}
          TARGET_SCOPE: ${{ inputs.target_scope }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p candidate/android
          if [[ -z "$ANDROID_RESULT" ]]; then
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          status = {
              'state': 'blocked',
              'source_revision': os.environ['SOURCE_REVISION'],
              'source_dirty': False,
              'reason': 'Android was not requested; a signed same-source runtime input and release signing secrets are required',
              'workflow_revision': os.environ['GITHUB_WORKFLOW_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }
          Path('candidate/android/status.json').write_text(json.dumps(status, indent=2, sort_keys=True) + '\n')
          PY
            android_state=blocked
          else
            android_state="$ANDROID_RESULT"
          fi
          python3 habab/scripts/release-candidate.py --root candidate --source-tree . --source-revision "$SOURCE_REVISION" --target-scope "$TARGET_SCOPE" --android-state "$android_state" --workflow-revision "$WORKFLOW_REVISION" --workflow-run-id "$WORKFLOW_RUN_ID" --workflow-run-attempt "$WORKFLOW_RUN_ATTEMPT" --output candidate/release-candidate.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest_path = Path('candidate/release-candidate.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['workflow_revision'] = os.environ['GITHUB_WORKFLOW_SHA']
          manifest['workflow_run_id'] = os.environ['GITHUB_RUN_ID']
          manifest['workflow_run_attempt'] = os.environ['GITHUB_RUN_ATTEMPT']
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
          python3 -m json.tool candidate/release-candidate.json >/dev/null
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: habab-release-candidate-${{ needs.resolve-source.outputs.source_revision }}
          path: candidate/release-candidate.json
          if-no-files-found: error
          retention-days: 1
