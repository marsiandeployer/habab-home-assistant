# Standalone/local-TLS example. The operator CLI defaults to edge termination
# and emits an HTTP backend vhost instead; it does not provision the TLS edge.
# Include this file from nginx's http {} context when TLS terminates here.
# Declare this map once for all homes. Per-home copies should copy only the
# server block below, then replace its hostname, certificate paths, and port.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name home-example.remote.habab.ru;
    if ($host != home-example.remote.habab.ru) { return 444; }

    ssl_certificate /etc/letsencrypt/live/home-example.remote.habab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home-example.remote.habab.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:32001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
