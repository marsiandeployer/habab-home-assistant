# Local VM104 endpoint behind the existing TLS/wildcard reverse proxy.
# Public anonymous mock UI only; never routes to the private Core container.
server {
    listen 80;
    server_name habab-demo.wpmix.net;
    root /root/homeassistent/habab/public;
    index index.html;
    include /root/homeassistent/habab/deploy/nginx-location.conf;
    location ^~ /downloads/ {
        try_files $uri =404;
        autoindex off;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /api/ha-telemetry {
        client_max_body_size 32k;
        access_log off;
        proxy_pass http://127.0.0.1:8318;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api/ha-demo/chat {
        proxy_pass http://127.0.0.1:8318;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /api/ha-demo/state {
        proxy_pass http://127.0.0.1:8318;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /api/ha-demo/realtime/bootstrap {
        client_max_body_size 2k;
        proxy_pass http://127.0.0.1:8318;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # Upstream's generated locale/font paths are relative to the app root.
    # Mount the complete public compiler tree here as well as its old subpath.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://habab-voice.wpmix.net; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://habab.ru https://www.habab.ru; form-action 'self'" always;
    }
}
