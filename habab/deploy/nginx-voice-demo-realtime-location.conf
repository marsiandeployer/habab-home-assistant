# Include inside the habab-voice.wpmix.net server block before location /.
location = /openai/demo/ws {
    proxy_pass http://127.0.0.1:18329;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $habab_voice_connection;
    proxy_connect_timeout 5s;
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
    proxy_buffering off;
}
