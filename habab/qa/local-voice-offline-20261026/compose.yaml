name: habab-local-voice-qa

x-qa-labels: &qa-labels
  com.habab.qa.owner: voice20_luna
  com.habab.qa.profile: local-voice-offline-20261026

services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
    pull_policy: never
    profiles: [offline]
    labels: *qa-labels
    restart: unless-stopped
    ports:
      - "127.0.0.1:18444:18444"
    volumes:
      - ha-config:/config
      - ./fixture/configuration.yaml:/config/configuration.yaml:ro
    networks: [offline]

  whisper:
    image: rhasspy/wyoming-whisper@sha256:ba6fcb6056ebe237d15a325381763a80af2fc8fcedaa04f6a714a7375eb20d80
    pull_policy: never
    profiles: [offline]
    labels: *qa-labels
    restart: unless-stopped
    command:
      - --model
      - small
      - --language
      - ru
      - --data-dir
      - /data
      - --download-dir
      - /data
      - --uri
      - tcp://0.0.0.0:10300
      - --local-files-only
    volumes:
      - whisper-models:/data
    networks: [offline]

  piper:
    image: rhasspy/wyoming-piper@sha256:7d39aafac409c2b6b09d999ed04d84c311d632e558b35baa60fad6aac722af7a
    pull_policy: never
    profiles: [offline]
    labels: *qa-labels
    restart: unless-stopped
    command:
      - --voice
      - ru_RU-denis-medium
      - --data-dir
      - /data
      - --uri
      - tcp://0.0.0.0:10200
      - --local-files-only
    volumes:
      - piper-models:/data
    networks: [offline]

  ollama:
    image: ollama/ollama@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
    pull_policy: never
    profiles: [offline]
    labels: *qa-labels
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_DEBUG_LOG_REQUESTS: "false"
    volumes:
      - ollama-models:/root/.ollama
    networks: [offline]

  prepare-whisper:
    image: rhasspy/wyoming-whisper@sha256:ba6fcb6056ebe237d15a325381763a80af2fc8fcedaa04f6a714a7375eb20d80
    pull_policy: never
    profiles: [prepare]
    labels: *qa-labels
    restart: "no"
    command:
      - --model
      - small
      - --language
      - ru
      - --data-dir
      - /data
      - --download-dir
      - /data
      - --uri
      - tcp://0.0.0.0:10300
    volumes:
      - whisper-models:/data
    networks: [downloads]

  prepare-piper:
    image: rhasspy/wyoming-piper@sha256:7d39aafac409c2b6b09d999ed04d84c311d632e558b35baa60fad6aac722af7a
    pull_policy: never
    profiles: [prepare]
    labels: *qa-labels
    restart: "no"
    command:
      - --voice
      - ru_RU-denis-medium
      - --data-dir
      - /data
      - --uri
      - tcp://0.0.0.0:10200
    volumes:
      - piper-models:/data
    networks: [downloads]

  prepare-ollama:
    image: ollama/ollama@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
    pull_policy: never
    profiles: [prepare]
    labels: *qa-labels
    restart: "no"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-models:/root/.ollama
    networks: [downloads]

networks:
  offline:
    internal: true
    labels: *qa-labels
  downloads:
    driver: bridge
    labels: *qa-labels

volumes:
  ha-config:
    labels: *qa-labels
  whisper-models:
    labels: *qa-labels
  piper-models:
    labels: *qa-labels
  ollama-models:
    labels: *qa-labels
