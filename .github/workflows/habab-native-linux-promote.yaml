name: Publish verified native Linux package

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Habab native Linux package run
        required: true
        type: string
      source_sha:
        description: Exact source SHA of that candidate
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: habab-native-linux-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.candidate_run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Verify completed candidate and download its tested package
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh run view "$RUN_ID" --json status,conclusion,headBranch,event,workflowName > run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('run.json'))
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['headBranch'] == 'main' and run['event'] == 'workflow_dispatch'
          assert run['workflowName'] == 'Habab native Linux package'
          PY
          gh run download "$RUN_ID" --name "habab-home-linux-arm64-$SOURCE_SHA" --dir candidate
          (cd candidate && sha256sum --check SHA256SUMS)
      - name: Verify package and native systemd smoke evidence
        id: package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, tarfile
          root = pathlib.Path('candidate')
          packages = list(root.glob('habab-home-linux-arm64-*.tar.gz'))
          assert len(packages) == 1
          with tarfile.open(packages[0]) as archive:
              release = json.load(archive.extractfile('payload/release.json'))
          smoke = json.loads((root / 'native-smoke.json').read_text())
          assert release['source_sha'] == os.environ['SOURCE_SHA'] == smoke['source_sha']
          assert release['architecture'] == 'arm64' and smoke['state'] == 'passed'
          assert release['frontend'] == smoke['frontend']
          assert smoke['installation'] == 'native systemd, no Docker'
          assert smoke['owner_onboarding'] == 'passed'
          assert smoke['authenticated_product_status'] == 'passed'
          assert smoke['restart_persistence'] == 'passed'
          tag = f"linux-{release['product_version']}-preview-{release['source_sha'][:12]}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\narchive={packages[0].name}\n')
          PY
      - name: Publish the tested bytes as a separate Linux prerelease
        env:
          TAG: ${{ steps.package.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern SHA256SUMS --dir existing
            cmp candidate/SHA256SUMS existing/SHA256SUMS
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --prerelease \
              --title "Habab Home native Linux ARM64 · $TAG" \
              --notes "Native Ubuntu 26.04 ARM64 package without Docker. Installation, owner onboarding and systemd restart checked on an ARM64 Actions VM. Physical Raspberry Pi, USB/Zigbee and full update/rollback acceptance remain separate. Source: $SOURCE_SHA; candidate run: $RUN_ID." \
              "candidate/$ARCHIVE" candidate/SHA256SUMS candidate/native-smoke.json
          fi
          # Use the public URL without authentication to prove users can download it.
          mkdir public-readback
          curl --fail --location --retry 2 \
            "https://github.com/$GH_REPO/releases/download/$TAG/$ARCHIVE" \
            --output "public-readback/$ARCHIVE"
          (cd public-readback && sha256sum --check ../candidate/SHA256SUMS)
          gh release view "$TAG" --json url,tagName,assets > publication.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-publication
          path: publication.json
          if-no-files-found: error
          retention-days: 1
