map $http_upgrade $habab_voice_edge_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name habab-voice.wpmix.net;
    access_log off;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name habab-voice.wpmix.net;
    ssl_certificate /etc/letsencrypt/live/wpmix.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wpmix.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 2m;
    location = /v1/audio/transcriptions {
        client_max_body_size 6m;
        client_body_timeout 20s;
        proxy_pass http://95.217.227.164;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
    }
    location / {
        proxy_pass http://95.217.227.164;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $habab_voice_edge_connection;
        proxy_buffering off;
        proxy_read_timeout 190s;
        proxy_send_timeout 60s;
    }
}
