# Example only: install in a dedicated product-relay sshd_config.d file.
# Use a unique account, public key, and loopback port for each home. Place this
# exact-user Match before any broader Match User patterns.
Match User habab-home-example
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/habab-product-tunnel/keys/%u
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitListen 127.0.0.1:32001
    PermitOpen none
    PermitTunnel no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitUserRC no
    MaxSessions 0
    ForceCommand /usr/bin/false
Match all

# Store this single enrolled key as one line in
# /etc/habab-product-tunnel/keys/habab-home-example (mode 0644, root-owned):
# restrict,port-forwarding,permitlisten="127.0.0.1:32001",command="/usr/bin/false" ssh-ed25519 <per-home-public-key>
#
# Set the account's login shell to /usr/sbin/nologin as an additional guard.
# The key's `port-forwarding` exception re-enables forwarding after `restrict`;
# sshd still allows remote forwarding only, on the exact loopback port above.
