name: Habab public release

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Frozen product SHA on main (controller may add only reviewed CI changes)
        required: true
        type: string
      release_tag:
        description: Immutable habab-v<VERSION>-<first 12 source SHA characters>
        required: true
        type: string
      candidate_run_id:
        description: Optional completed whole candidate run for publish-only retry (no builds)
        required: false
        default: ''
        type: string
      frontend_run_id:
        description: Optional completed exact-product frontend producer run; preserves its original manifest
        required: false
        default: ''
        type: string
      android_version_code:
        description: New reviewed Android versionCode, greater than distributed builds
        required: true
        type: string
      android_version_name:
        description: Reviewed public Android versionName
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: habab-public-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_revision: ${{ steps.source.outputs.source_revision }}
      reuse_candidate: ${{ steps.source.outputs.reuse_candidate }}
      producer_revision: ${{ steps.source.outputs.producer_revision }}
      producer_run_id: ${{ steps.source.outputs.producer_run_id }}
      producer_run_attempt: ${{ steps.source.outputs.producer_run_attempt }}
      candidate_manifest_sha256: ${{ steps.source.outputs.candidate_manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            habab/scripts
            habab/distribution
            habab/android/tools
            habab/native-frontend
            .github/workflows
          persist-credentials: false
      - name: Require immutable source/tag and an unused release identity
        id: source
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          FRONTEND_RUN_ID: ${{ inputs.frontend_run_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.android_version_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          python3 - <<'PY'
          import os
          import runpy
          import json
          import subprocess
          from pathlib import Path
          helpers = runpy.run_path('habab/scripts/github-release.py')
          helpers['release_base'](os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG'], os.environ['SOURCE_REVISION'])
          helpers['validate_controller_range'](Path('.'), os.environ['SOURCE_REVISION'], os.environ['GITHUB_SHA'])
          candidate_run = os.environ['CANDIDATE_RUN_ID']
          identity = {'workflow_revision': os.environ['GITHUB_SHA'], 'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                      'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          manifest_sha = ''
          if candidate_run:
              if not candidate_run.isdecimal() or int(candidate_run) <= 0:
                  raise SystemExit('Candidate run ID must be a positive integer')
              import hashlib
              repository = os.environ['GITHUB_REPOSITORY']
              producer = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repository + '/actions/runs/' + candidate_run]))
              helpers['validate_controller_range'](Path('.'), os.environ['SOURCE_REVISION'], producer['head_sha'])
              pages = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp',
                  'repos/' + repository + '/actions/runs/' + candidate_run + '/jobs?filter=latest&per_page=100']))
              jobs = [job for page in pages for job in page['jobs']]
              directory = Path(os.environ['RUNNER_TEMP']) / 'reused-candidate-manifest'
              directory.mkdir(parents=True, exist_ok=True)
              subprocess.run(['gh', 'run', 'download', candidate_run, '--repo', repository,
                  '--name', 'habab-release-candidate-' + os.environ['SOURCE_REVISION'], '--dir', str(directory)], check=True)
              manifest_path = directory / 'release-candidate.json'
              identity = helpers['validate_candidate_reuse'](producer, json.loads(manifest_path.read_text()), jobs,
                  repository, os.environ['SOURCE_REVISION'], candidate_run,
                  os.environ['ANDROID_VERSION_CODE'], os.environ['ANDROID_VERSION_NAME'])
              manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          frontend_run = os.environ['FRONTEND_RUN_ID']
          if frontend_run and not candidate_run:
              if not frontend_run.isdecimal() or int(frontend_run) <= 0:
                  raise SystemExit('Frontend run ID must be a positive integer')
              producer = json.loads(subprocess.check_output([
                  'gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + frontend_run]))
              helpers['validate_frontend_run'](producer, os.environ['GITHUB_REPOSITORY'], os.environ['SOURCE_REVISION'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('reuse_candidate=' + ('true' if candidate_run else 'false') + '\n')
              output.write('producer_revision=' + identity['workflow_revision'] + '\n')
              output.write('producer_run_id=' + identity['workflow_run_id'] + '\n')
              output.write('producer_run_attempt=' + identity['workflow_run_attempt'] + '\n')
              output.write('candidate_manifest_sha256=' + manifest_sha + '\n')
          PY
          [[ -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")" ]] || {
            echo '::error::Release tag already exists; immutable releases cannot be overwritten'; exit 1;
          }
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          if any(item['tag_name'] == os.environ['RELEASE_TAG'] for item in json.loads(
                  (Path(os.environ['RUNNER_TEMP']) / 'releases.json').read_text())):
              raise SystemExit('A release/draft with this tag already exists; inspect it before retrying')
          PY
          echo "source_revision=$SOURCE_REVISION" >> "$GITHUB_OUTPUT"
      - name: Require existing signing credentials before any platform build
        if: ${{ inputs.candidate_run_id == '' }}
        env:
          HABAB_ANDROID_RUNTIME_SIGNING_KEY_BASE64: ${{ secrets.HABAB_ANDROID_RUNTIME_SIGNING_KEY_BASE64 }}
          HABAB_ANDROID_KEYSTORE_BASE64: ${{ secrets.HABAB_ANDROID_KEYSTORE_BASE64 }}
          HABAB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HABAB_ANDROID_KEYSTORE_PASSWORD }}
          HABAB_ANDROID_KEY_ALIAS: ${{ secrets.HABAB_ANDROID_KEY_ALIAS }}
          HABAB_ANDROID_KEY_PASSWORD: ${{ secrets.HABAB_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in HABAB_ANDROID_RUNTIME_SIGNING_KEY_BASE64 HABAB_ANDROID_KEYSTORE_BASE64 HABAB_ANDROID_KEYSTORE_PASSWORD HABAB_ANDROID_KEY_ALIAS HABAB_ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Missing required signing secret: $name"; exit 1; }
          done
      - name: Test strict release gates
        run: PYTHONPATH=habab/scripts python3 -m unittest -v test_github_release test_release_candidate.ReleaseCandidateTests.test_android_workflow_accepts_and_rejects_locked_node_inventory

  candidate:
    needs: validate
    if: ${{ inputs.candidate_run_id == '' }}
    uses: ./.github/workflows/habab-release-candidate.yaml
    with:
      target_scope: all
      source_ref: ${{ needs.validate.outputs.source_revision }}
      release_tag: ${{ inputs.release_tag }}
      frontend_run_id: ${{ inputs.frontend_run_id }}
      android_version_code: ${{ inputs.android_version_code }}
      android_version_name: ${{ inputs.android_version_name }}
    secrets:
      HABAB_ANDROID_RUNTIME_SIGNING_KEY_BASE64: ${{ secrets.HABAB_ANDROID_RUNTIME_SIGNING_KEY_BASE64 }}
      HABAB_ANDROID_KEYSTORE_BASE64: ${{ secrets.HABAB_ANDROID_KEYSTORE_BASE64 }}
      HABAB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HABAB_ANDROID_KEYSTORE_PASSWORD }}
      HABAB_ANDROID_KEY_ALIAS: ${{ secrets.HABAB_ANDROID_KEY_ALIAS }}
      HABAB_ANDROID_KEY_PASSWORD: ${{ secrets.HABAB_ANDROID_KEY_PASSWORD }}

  publish:
    needs: [validate, candidate]
    if: ${{ always() && needs.validate.result == 'success' && (needs.candidate.result == 'success' || (needs.validate.outputs.reuse_candidate == 'true' && needs.candidate.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_REVISION: ${{ needs.validate.outputs.source_revision }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      WORKFLOW_REVISION: ${{ github.sha }}
      PRODUCER_WORKFLOW_REVISION: ${{ needs.validate.outputs.producer_revision }}
      PRODUCER_RUN_ID: ${{ needs.validate.outputs.producer_run_id }}
      PRODUCER_RUN_ATTEMPT: ${{ needs.validate.outputs.producer_run_attempt }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.validate.outputs.candidate_manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            habab/scripts
            habab/distribution
            habab/android/tools
            habab/android/app/src/main/assets/release
            habab/native-frontend
      - name: Check out the frozen product separately from controller tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_revision }}
          path: product-source
          persist-credentials: false
          sparse-checkout: |
            habab/distribution
            habab/product-tunnel
            habab/android/tools
            habab/android/app/src/main/assets/release
            habab/native-frontend
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: candidate-*
          path: candidate
          merge-multiple: true
          run-id: ${{ needs.validate.outputs.producer_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: habab-release-candidate-${{ needs.validate.outputs.source_revision }}
          path: candidate
          run-id: ${{ needs.validate.outputs.producer_run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact payloads and signatures before creating a draft
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$WORKFLOW_REVISION" ]]
          [[ "$(git -C product-source rev-parse HEAD)" == "$SOURCE_REVISION" ]]
          git diff --quiet && git diff --cached --quiet
          git -C product-source diff --quiet && git -C product-source diff --cached --quiet
          if [[ -n "$EXPECTED_MANIFEST_SHA256" ]]; then
            printf '%s  candidate/release-candidate.json\n' "$EXPECTED_MANIFEST_SHA256" | sha256sum --check
          fi
          python3 habab/scripts/github-release.py --root candidate --source-tree product-source \
            --source-revision "$SOURCE_REVISION" --workflow-revision "$PRODUCER_WORKFLOW_REVISION" \
            --publisher-revision "$WORKFLOW_REVISION" --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --output release --receipt upload-receipt.json
          (cd release && sha256sum --check SHA256SUMS)
      - name: Create draft and upload verified assets without replacement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('release-notes.md').write_text(
              'Habab Home for Windows, Android, Linux amd64 and arm64.\n\n'
              + 'Source: `' + os.environ['SOURCE_REVISION'] + '`.\n\n'
              + 'Checksums and build provenance are in `SHA256SUMS` and `release-receipt.json`.\n'
              + 'Build verification does not replace physical device acceptance.\n')
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_REVISION" >/dev/null
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Habab Home $RELEASE_TAG" --notes-file release-notes.md --draft
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY"
      - name: Verify GitHub calculated asset hashes and publish
        run: |
          set -euo pipefail
          release_id=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > uploaded-release.json
          python3 habab/scripts/github-release.py --receipt upload-receipt.json --verify-uploaded uploaded-release.json
          tag_source=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          [[ "$tag_source" == "$SOURCE_REVISION" ]] || { echo '::error::Release tag source changed'; exit 1; }
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Read back published direct download endpoints
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -Fx false
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          curl --fail --location --silent --show-error "$base/release-receipt.json" -o published-receipt.json
          cmp published-receipt.json release/release-receipt.json
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          receipt = json.loads(Path('upload-receipt.json').read_text())
          for item in receipt['assets']:
              url = 'https://github.com/' + receipt['repository'] + '/releases/download/' + receipt['tag'] + '/' + item['name']
              subprocess.run(['curl', '--fail', '--head', '--location', '--silent', '--show-error', url],
                             stdout=subprocess.DEVNULL, check=True)
          PY
