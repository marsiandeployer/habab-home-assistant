# TLS edge: route only this hostname to the application server.
# The application server authenticates Home Assistant and owns test expiry.
server {
    listen 80;
    server_name habab-demo.wpmix.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name habab-demo.wpmix.net;

    ssl_certificate /etc/letsencrypt/live/wpmix.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wpmix.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1M;

    location = /api/ha-telemetry {
        client_max_body_size 32k;
        access_log off;
        proxy_pass http://95.217.227.164;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Stream immutable Android runtimes without spooling large bodies to edge disk.
    location ~ "^/downloads/android/habab-runtime-[0-9a-f]{16}-arm64\.tgz$" {
        proxy_pass http://95.217.227.164;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 45s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://95.217.227.164;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 45s;
    }

    location = /api/websocket {
        proxy_pass http://95.217.227.164;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }
}
