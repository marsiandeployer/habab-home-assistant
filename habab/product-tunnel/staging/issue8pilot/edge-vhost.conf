# Staged for issue8pilot; paired VM104 backend loopback port 32808.
# Do not install until DNS and certificate are verified.
server {
    listen 80;
    server_name home-issue8pilot.remote.habab.ru;
    if ($host != home-issue8pilot.remote.habab.ru) { return 444; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/habab.ru;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name home-issue8pilot.remote.habab.ru;
    if ($host != home-issue8pilot.remote.habab.ru) { return 444; }

    ssl_certificate /etc/letsencrypt/live/home-issue8pilot.remote.habab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home-issue8pilot.remote.habab.ru/privkey.pem;

    location / {
        proxy_pass http://95.217.227.164:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
