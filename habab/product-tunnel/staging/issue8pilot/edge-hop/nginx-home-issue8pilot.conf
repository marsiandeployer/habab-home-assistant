# habab-product-tunnel-managed-v2; generated for issue8pilot; TLS terminates on this relay
server {
    listen 443 ssl;
    server_name home-issue8pilot.remote.habab.ru;
    if ($host != home-issue8pilot.remote.habab.ru) { return 444; }

    ssl_certificate /etc/letsencrypt/live/home-issue8pilot.remote.habab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home-issue8pilot.remote.habab.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:32808;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
