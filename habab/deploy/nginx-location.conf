# The official frontend requests many immutable chunks concurrently. Serve only
# its public static build outside the page-level request limiter.
location = /demos/home-assistant {
    if ($host !~* ^((www\.)?habab\.ru|habab-demo\.wpmix\.net)$) { return 404; }
    absolute_redirect off;
    return 308 /demos/home-assistant/;
}
location ^~ /demos/home-assistant/map-tiles/ {
    if ($host !~* ^((www\.)?habab\.ru|habab-demo\.wpmix\.net)$) { return 404; }
    if ($uri !~ "^/demos/home-assistant/map-tiles/([0-9]|1[0-9])/[0-9]{1,6}/[0-9]{1,6}\.png$") { return 404; }
    limit_except GET { deny all; }
    rewrite ^/demos/home-assistant/map-tiles/(.*)$ /$1 break;
    proxy_pass https://tile.openstreetmap.org;
    proxy_ssl_server_name on;
    proxy_ssl_name tile.openstreetmap.org;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host tile.openstreetmap.org;
    proxy_set_header User-Agent "HababHomeDemo/1.0 (+https://habab.ru; contact: mail@habab.ru)";
    proxy_set_header Referer "https://$host/demos/home-assistant/";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Cache-Control "";
    proxy_set_header Pragma "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_cache habab_ha_map;
    proxy_cache_key "habab-ha-osm:$uri";
    proxy_cache_valid 200 7d;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Habab-Map-Cache $upstream_cache_status always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /demos/home-assistant/ {
    if ($host !~* ^((www\.)?habab\.ru|habab-demo\.wpmix\.net)$) { return 404; }
    alias /root/homeassistent/habab/public/;
    index index.html;
    autoindex off;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://habab-voice.wpmix.net; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://habab.ru https://www.habab.ru; form-action 'self'" always;
}
