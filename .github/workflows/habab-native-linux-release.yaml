name: Habab native Linux package

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit on main containing the native Linux installer
        required: true
        type: string
      wheel_version:
        description: Fresh Habab frontend version (20260930.4+habab.N)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: habab-native-linux-package
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout: habab/distribution/linux
          persist-credentials: false
      - name: Resolve exact main source
        id: resolve
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse "$SOURCE_SHA^{commit}")" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git cat-file -e "$SOURCE_SHA:habab/distribution/linux/package.py"
          echo "revision=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  frontend:
    needs: source
    uses: ./.github/workflows/habab-native-frontend-candidate.yaml
    with:
      source_ref: ${{ needs.source.outputs.revision }}
      wheel_version: ${{ inputs.wheel_version }}

  package:
    needs: [source, frontend]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ needs.source.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          sparse-checkout: |
            habab/distribution
            habab/native-frontend
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.frontend.outputs.artifact_name }}
          path: frontend-candidate
      - name: Validate fresh frontend identity
        run: |
          set -euo pipefail
          python3 - "$SOURCE_SHA" <<'PY'
          import sys
          sys.path.insert(0, 'habab/native-frontend')
          from candidate import load_candidate
          load_candidate('frontend-candidate', sys.argv[1])
          PY
      - name: Check installer and run focused packaging tests
        run: |
          set -euo pipefail
          find habab/distribution/linux -name '*.sh' -exec bash -n {} +
          python3 -m unittest discover -s habab/distribution/linux -p 'test_*.py' -v
      - name: Package exact-source native installer and frontend
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet
          wheel=$(python3 -c 'import json; print(json.load(open("frontend-candidate/manifest.json"))["artifact"])')
          python3 habab/distribution/linux/package.py \
            --source-sha "$SOURCE_SHA" \
            --frontend-wheel "frontend-candidate/$wheel" \
            --frontend-manifest frontend-candidate/manifest.json \
            --output "dist/habab-home-linux-arm64-${SOURCE_SHA:0:12}.tar.gz"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Install and exercise the native systemd service without Docker
        run: |
          set -euo pipefail
          python3 habab/distribution/linux/ci_smoke.py \
            --package "dist/habab-home-linux-arm64-${SOURCE_SHA:0:12}.tar.gz" \
            --source-sha "$SOURCE_SHA" \
            --frontend-version "${{ inputs.wheel_version }}" \
            --output dist/native-smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: habab-home-linux-arm64-${{ needs.source.outputs.revision }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
